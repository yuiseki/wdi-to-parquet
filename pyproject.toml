[project]
name = "wdi-to-parquet"
version = "0.1.0"
description = "Convert World Bank WDI indicators to long-format Parquet for DuckDB analytical queries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2",
    "pyarrow>=18",
    "requests>=2.32",
]

[project.scripts]
wdi-to-parquet = "wdi_to_parquet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wdi_to_parquet"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-mock>=3.14",
    "duckdb>=1.5.5",
    "huggingface-hub>=2.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access (deselect with -m 'not network')",
    "e2e: end-to-end tests; requires network + DuckDB spatial (deselect with -m 'not e2e')",
]
