checked:
  note: scripts/02_verify.py, before upload
  items:
    - zip against MANIFEST.json
    - left-out indicators equal the union recomputed from every original WDISeries.csv
    - rebuilt CSVs equal the original records minus the left-out ones, in order, same BOM
    - data.parquet equals the original non-empty cells minus the left-out indicators (checksum over country, indicator, year, exact float; original read with Python's csv module)
    - year_int equals the year read from Year
    - no file holds a left-out indicator
    - every Parquet opens in a plain DuckDB, no bloom filters

modifications:
  raw: not published; the World Bank's zips contain the left-out indicators
  csv: the six CSVs without the left-out indicators' records; kept records byte for byte
  parquet:
    - values in long format, empty cells dropped, value as DOUBLE, a non-number stops the build
    - metadata tables as text, year_int added to footnotes and series_time
    - written without bloom filters
